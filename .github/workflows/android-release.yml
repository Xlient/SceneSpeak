# Android release APK (Expo app in apps/mobile).
#
#   git tag v0.2.0 && git push origin v0.2.0   → APK + SHA256SUMS on a GitHub Release
#   Actions → Android release → Run workflow     → same build, as a workflow artifact
#
# Signing: with the upload-key secrets below the APK is signed for Google Play. Without them it's
# signed with Expo's debug key: fine for sideloading by judges and testers, not uploadable to Play.
#
# Secrets (Settings → Secrets and variables → Actions), all optional:
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64   base64 of google-services.json (native Firebase AI Logic)
# Variables (public client config, inlined into the JS bundle):
#   EXPO_PUBLIC_FIREBASE_API_KEY, _AUTH_DOMAIN, _PROJECT_ID, _STORAGE_BUCKET, _MESSAGING_SENDER_ID, _APP_ID
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release on tags

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - id: version
        name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          # Play needs a strictly higher versionCode for every upload: the run number grows.
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17" # React Native's CMake step fails on newer JDKs
      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No upload key: this APK is debug-signed (sideloading only, not for Google Play)."
          else
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "SCENESPEAK_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Firebase native config
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then echo "$GOOGLE_SERVICES_B64" | base64 --decode > google-services.json; fi

      - name: Prebuild (generate android/)
        env:
          SCENESPEAK_VERSION_NAME: ${{ steps.version.outputs.name }}
          SCENESPEAK_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build
        working-directory: apps/mobile/android
        env:
          SCENESPEAK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SCENESPEAK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SCENESPEAK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        # 64-bit only: arm64-v8a is every recent phone, x86_64 is the emulator.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/SceneSpeak.apk "dist/SceneSpeak-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum -- * > SHA256SUMS)
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: scenespeak-android-${{ steps.version.outputs.name }}
          path: apps/mobile/dist/
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/mobile/dist/*.apk
            apps/mobile/dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
