# iOS Simulator build of the Expo app (apps/mobile): no Apple Developer account needed (ad-hoc signed,
# simulator only). Gives a .app you can drag onto a simulator; on version tags it's attached to the
# GitHub Release next to the Android APK, for judges and testers.
#
# macOS runners use Actions minutes 10x faster than Linux, so this runs on release tags and on demand.
# Device builds, TestFlight and the App Store need the Apple Developer Program.
#
# Variables: the same EXPO_PUBLIC_FIREBASE_* and EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID as android-release.yml,
# plus EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME (reversed iOS client ID) for Google sign-in.
# Secrets: GOOGLE_SERVICE_INFO_PLIST_BASE64 (native Firebase AI Logic) and SCENESPEAK_APPCHECK_DEBUG_TOKEN
# (registered for the iOS app; simulator builds can't use App Attest, so they carry it).
name: iOS simulator build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the build to the GitHub Release on tags

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      LANG: en_US.UTF-8 # CocoaPods fails on ASCII locales
      LC_ALL: en_US.UTF-8
      EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: pnpm

      - name: Select the newest Xcode
        working-directory: .
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Firebase native config
        env:
          SERVICE_INFO_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$SERVICE_INFO_B64" ]; then echo "$SERVICE_INFO_B64" | base64 --decode > GoogleService-Info.plist; fi

      - name: Prebuild (generate ios/ and install pods)
        env:
          SCENESPEAK_APPCHECK_DEBUG_TOKEN: ${{ secrets.SCENESPEAK_APPCHECK_DEBUG_TOKEN }}
        run: |
          pnpm exec expo prebuild --platform ios --clean
          # prebuild reports a failed `pod install` but still exits 0: fail here instead.
          ls -d ios/*.xcworkspace >/dev/null 2>&1 || { echo "::error::pod install failed (no .xcworkspace)"; exit 1; }

      - name: Build for the simulator
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          # Ad-hoc signed ("-"), not unsigned: unsigned apps get no keychain in the Simulator, which breaks
          # Google sign-in. Full log goes to a file; on failure only the error lines are shown.
          if ! xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
              -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
              -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= > xcodebuild.log 2>&1; then
            grep -nE "error:|fatal|\*\* BUILD FAILED" xcodebuild.log | head -60
            exit 1
          fi
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          mkdir -p dist && (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/apps/mobile/dist/SceneSpeak-simulator.zip" "$(basename "$APP")")

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/mobile/xcodebuild.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: scenespeak-ios-simulator
          path: apps/mobile/dist/SceneSpeak-simulator.zip
          retention-days: 14

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/dist/SceneSpeak-simulator.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
